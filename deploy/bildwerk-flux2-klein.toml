# Bildwerk: FLUX.2 klein 9B. Je Prozess genau ein Modell; es lädt beim Start, laufen heißt geladen.
# Der Dienst startet nie von selbst: Starten und Anhalten nur über den Maschinenraum, wenn die Leitstelle es verlangt.
# installieren.sh legt diese Datei als ~/Maschinenraum/dienste/bildwerk-flux2-klein.toml an (ordner auf den Klon gesetzt).
name = "FLUX.2 klein 9B"
beschreibung = "Schnelle Bilder aus Text in 4 Schritten und Bilder nach bis zu 4 Vorlagen (Stil, Bezug); Lizenz nur nicht-kommerziell"
ordner = "~/Entwicklung/Werkzeuge/Bildwerk"
befehl = [".venv/bin/python", "-m", "bildwerk", "flux2-klein", "--port", "$MASCHINENRAUM_PORT"]
port = 8792
pruefadresse = "http://127.0.0.1:8792/gesundheit"
faehigkeiten = ["bild_erzeugen"]
eignung = ["schnell"]
sprachen = ["en"]
# Schätzung bis zur ersten Messung: in 8 Bit rund 18 GB Gewichte (Transformer 9 und Textkodierer 8 Mrd. Parameter),
# dazu die Rechnung je Bild samt Vorlagen und das Laden, das die bf16-Gewichte (35 GB auf der Platte) liest und quantisiert
speicher_gb = 24
startzeit_s = 300
anhaltezeit_s = 30

[umgebung]
HF_HUB_OFFLINE = "1"
BILDWERK_QUANTISIERUNG = "8bit"
