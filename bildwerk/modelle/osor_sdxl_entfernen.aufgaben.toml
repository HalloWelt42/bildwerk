# Aufgabenvorlagen für OSOR-SDXL (Dienst bild-entfernen-osor, ATL-43 des Ateliers).
#
# OSOR kennt nur Entfernen; sein Text ist fest, die Anweisung wird nicht gelesen. Die Fläche
# steht in der Vorlage deckend in der Signalfarbe; der Dienst macht daraus die Maske, die das Modell braucht.

[entfernen]
anweisung = "Remove the marked area."
sprache = "en"
signalfarbe = [255, 0, 255]
