# Aufgabenvorlagen für LaMa (Dienst bild-entfernen-schnell, ATL-33 des Ateliers).
#
# LaMa kennt nur Entfernen und keine Anweisung: der Text wird nicht gelesen. Die Fläche steht in der Vorlage deckend in
# der Signalfarbe; der Dienst macht daraus die Maske, die das Modell braucht.

[entfernen]
anweisung = "Remove the marked area."
sprache = "en"
signalfarbe = [255, 0, 255]
