# Bildwerk: Qwen-Image-Edit-2511. Je Prozess genau ein Modell; es lädt beim Start, laufen heißt geladen.
# Der Dienst startet nie von selbst: Starten und Anhalten nur über den Maschinenraum, wenn die Leitstelle es verlangt.
# installieren.sh legt diese Datei als ~/Maschinenraum/dienste/bildwerk-qwen-image-edit.toml an (ordner auf den Klon gesetzt).
name = "Qwen-Image-Edit-2511"
beschreibung = "Bilder nach Anweisung bearbeiten und nach 1 bis 3 Vorlagen neu zeichnen (Stil, Person, Produkt, Szene); Apache-2.0, frei nutzbar; nur mit Vorlage"
ordner = "~/Entwicklung/Werkzeuge/Bildwerk"
befehl = [".venv/bin/python", "-m", "bildwerk", "qwen-image-edit", "--port", "$MASCHINENRAUM_PORT"]
port = 8795
pruefadresse = "http://127.0.0.1:8795/gesundheit"
faehigkeiten = ["bild_erzeugen"]
eignung = ["gruendlich"]
sprachen = ["en", "zh"]
# Schätzung bis zur ersten Messung: Bildteil 20 Mrd. Parameter in 8 Bit rund 20 GB, Textkodierer mit Bildteil in
# bfloat16 rund 15,5 GB (mflux), dazu die Rechnung je Bild samt Vorlagen
speicher_gb = 44
startzeit_s = 300
anhaltezeit_s = 30

[umgebung]
HF_HUB_OFFLINE = "1"
BILDWERK_QUANTISIERUNG = "8bit"
