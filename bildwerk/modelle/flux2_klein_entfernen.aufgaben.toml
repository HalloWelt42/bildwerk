# Aufgabenvorlagen für FLUX.2 klein 4B mit erase-v1 (Dienst bild-entfernen, ATL-43 des Ateliers).
#
# Das LoRA kennt nur Entfernen; seinen Text bringt es fertig kodiert mit, die Anweisung wird nicht gelesen. Die Fläche
# steht in der Vorlage deckend in der Signalfarbe; der Dienst macht daraus die Maske, die das Modell braucht.

[entfernen]
anweisung = "Remove the marked area."
sprache = "en"
signalfarbe = [255, 0, 255]
